; ============================================================================
;  AVR128DB48 experiments - bare-metal C++, no framework, under PlatformIO.
;
;  Toolchain: the machine's OWN self-built avr-gcc 16.2 at /sw/avr (symlink to
;  /sw/avr-16.2, built by /sw/src/build-avr.sh) - NOT PlatformIO's bundled
;  (old) toolchain-atmelavr. It also provides avr-gdb 17.2 and avrdude 8.1;
;  the latter drives the Atmel-ICE over UPDI. A minimal package.json manifest
;  (generated by build-avr.sh's finalize stage) makes the folder usable as a
;  symlink:// package; without it PIO fails with MissingPackageManifestError.
;
;  DEBUG: PyAvrOCD (https://pyavrocd.io, installed via pipx to ~/.local/bin)
;  is used as GDB server, wired below as debug_tool = custom. The platform
;  points at felias-fogg's fork (currently identical to upstream atmelmegaavr
;  v1.10.0): once PyAvrOCD integration lands there, debug_tool = pyavrocd will
;  replace the custom block. udev rules for the EDBG probes are installed at
;  /etc/udev/rules.d/99-edbg-debuggers.rules.
;
;  MULTI-APP (inherited from uliano/blackpill-experiments): every
;  src/apps/<app>.cpp has its own main() and becomes its own [env:<app>].
;  Those env blocks are AUTO-GENERATED into apps.ini by tools/gen_apps.py
;  (VS Code task "PIO: regen apps", then reload the project). Each app then
;  gets its own Build / Upload / Monitor buttons in the PlatformIO sidebar.
;
;  Every app gets TWO envs: [env:<app>] (release, -Os) and [env:<app>-debug]
;  (build_type = debug -> debug_build_flags: -Og -g3 -fno-inline). Debug
;  flags therefore never leak into release firmware; use the -debug env for
;  every debugging session (pio debug -e <app>-debug) and the plain env for
;  production uploads. Separate build dirs = no rebuild churn when switching.
;
;  SHARED CODE lives in lib/brio (PlatformIO private library, lib/brio/src):
;  the Library Dependency Finder compiles it for every env that includes its
;  headers, so no build_src_filter entry is needed for it.
; ============================================================================

[platformio]
; src_dir is the project root so build_src_filter can reach anything; we start
; the filter from nothing and add back exactly the files each env wants.
src_dir = .
; the per-app [env:<app>] sections live in this generated file:
extra_configs = apps.ini
default_envs = blink

; ============================================================================
;  Custom (non-[env]) variables, referenced via ${common.*} interpolation.
;  Keeping them out of [env] avoids PlatformIO's "unknown option" warning.
; ============================================================================
[common]
; WHICH project files compile: none by default - each [env:<app>] in apps.ini
; re-uses this and appends its own app main. Shared code is NOT listed here:
; it lives in lib/brio and is compiled/linked by the LDF automatically.
base_src_filter = -<*>

; ============================================================================
;  Shared base inherited by every generated [env:<app>]
; ============================================================================
[env]
; felias-fogg fork of atmelmegaavr: today a plain mirror of upstream v1.10.0,
; but it is where PyAvrOCD's PlatformIO integration for megaAVR/Dx will land.
platform = https://github.com/felias-fogg/platform-atmelmegaavr.git
board = AVR128DB48
; (no framework line) -> bare metal: avr-gcc + avr-libc only, no Arduino core.

; --- Force the project toolchain (avr-gcc 16.2), NOT PlatformIO's old one. ----
;     symlink:// makes PIO use this folder in place without downloading anything,
;     so the obsolete bundled toolchain is never even fetched.
platform_packages =
    toolchain-atmelavr@symlink:///sw/avr

; --- All compiler/linker flags + IntelliSense include paths live in this build
;     script, with proper per-language separation (CCFLAGS/CFLAGS/CXXFLAGS).
;     MUST be `pre:` so env.Append() runs BEFORE PlatformIO clones the project
;     source env (projenv) - a plain/post script would not reach the src files.
;     gen_lst.py is `post:` - it emits firmware.lst and moves firmware.map.
extra_scripts =
    pre:tools/pio_flags.py
    post:tools/gen_lst.py

; --- WHICH files compile. The base (src/common) lives in [common] above; each
;     [env:<app>] in apps.ini re-uses it and appends its own main.
;     (build_src_filter in a child env REPLACES, hence the re-use.)
build_src_filter = ${common.base_src_filter}

; --- The platform's bare-metal builder (_bare.py) injects -flto even in debug
;     builds. LTO splits the DWARF line info across partition CUs, and avr-gdb
;     then refuses file:line breakpoints ("No compiled code for line N") while
;     function breakpoints still work. LTO buys nothing on firmwares this size,
;     so disable it globally; the release .lst gets more readable too.
;     -std=gnu++11 also comes from _bare.py and lands AFTER our -std=gnu++23
;     (extra_scripts pre: runs first), which would win and break concepts &
;     co. - unflag it so gnu++23 from tools/pio_flags.py is in effect.
build_unflags = -flto -fuse-linker-plugin -std=gnu++11

; --- Debug build profile, applied ONLY to build_type = debug (the generated
;     [env:<app>-debug] envs); pio_flags.py adds -Os only to release builds,
;     so these never mix. GCC 16.x emits a DWARF5 file table with a duplicate
;     entry for the main source (entries 0 and 2) and switches file mid-line-
;     program around inlined code; both avr-gdb 17.2 and host gdb 15.1 then
;     drop part of the line table and file:line breakpoints fail to bind at
;     any -O level above 0 ("No compiled code for line N"). -fno-inline avoids
;     the mid-function file switches and restores line breakpoints, while
;     always_inline code (e.g. _delay_ms) stays inlined and correct.
;     KNOWN CAVEAT: a line whose only content is a call into an always_inline
;     system-header function (e.g. a bare `_delay_ms(500);`) still cannot take
;     a line breakpoint; break on a neighbouring line or use a function BP.
debug_build_flags = -Og -g3 -ggdb3 -fno-inline

; --- Peripheral register view (PERIPHERALS panel in the VS Code debug
;     sidebar). SVD generated from the Microchip ATDF by the PyAvrOCD project
;     (repo svd/ folder); copied into svd/. CLion renders the same SVD too.
debug_svd_path = svd/avr128db48.svd

; --- Flash via the Atmel-ICE over UPDI, using the toolchain's avrdude 8.x
;     (PlatformIO's bundled avrdude 7.1 is too old for AVR-Dx). No hardware is
;     needed for `pio run` (build only); this runs only on `-t upload`.
;     The self-built avrdude finds its own avrdude.conf in /sw/avr/etc.
upload_protocol = atmelice_updi
upload_command = /sw/avr/bin/avrdude -p $BOARD_MCU -c atmelice_updi -U flash:w:$SOURCE:i

; --- Debug via PyAvrOCD (GDB server, port 40044) + the toolchain's avr-gdb.
;     Mirrors the wiring of felias-fogg/platform-atmelavr for EDBG probes,
;     minus the debugWIRE bits (UPDI needs no mode switch). -m all lets
;     PyAvrOCD manage the relevant fuses; -P 2000 is the UPDI programming
;     clock in kHz; -F is F_CPU in Hz (matches board JSON / init_clock_24mhz).
;     --breakpoints hardware forbids software breakpoints (no flash wear):
;     the UPDI OCD has 2 hardware breakpoints, and GDB borrows one for its
;     temporary breakpoints (tbreak main, next over a call, finish, run-to-
;     line), so treat it as ONE free user breakpoint; a breakpoint that does
;     not fit is refused ("Cannot insert breakpoint") instead of going to
;     flash. Escape hatch for a session: monitor breakpoints all.
debug_tool = custom
debug_port = :40044
debug_server =
    /home/uliano/.local/bin/pyavrocd
    --breakpoints
    hardware
    -s
    nop
    -p
    40044
    -m
    all
    -d
    avr128db48
    -i
    updi
    -t
    atmelice
    -F
    24000000
    -P
    2000
debug_init_cmds =
    define pio_reset_halt_target
       monitor reset
    end
    define pio_reset_run_target
       monitor reset
       monitor disconnect
       detach
    end
    target remote $DEBUG_PORT
    $INIT_BREAK
    $LOAD_CMDS

; Serial monitor: the on-board CH340 USB-serial bridge (USART2 on PF0/PF1).
; CH340 enumerates as /dev/ttyUSB* on Linux; adjust if another USB-serial
; device grabs ttyUSB0 first (run `pio device list` to check). Upload still
; goes via the Atmel-ICE/UPDI, not this port.
monitor_speed = 460800
monitor_port = /dev/ttyUSB0
